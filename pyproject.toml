[project]
name = "tiger-mcp"
version = "1.0.0"
description = "Tiger Brokers MCP (Model Context Protocol) System - Connect Claude AI to Tiger Brokers API"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Tiger MCP Contributors"}
]
license = {file = "LICENSE"}
homepage = "https://github.com/your-username/tiger-mcp"
repository = "https://github.com/your-username/tiger-mcp"
keywords = ["tiger-brokers", "mcp", "trading", "claude-ai", "api"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "fastapi>=0.116.1",
    "loguru>=0.7.3",
    "tigeropen>=3.4.4",
    "uvicorn>=0.35.0",
    "fastmcp>=0.2.0",
    "pydantic>=2.11.0",
    "requests>=2.31.0",
]

[project.scripts]
tiger-mcp-server = "tiger_mcp.server:main"
tiger-mcp-client = "tiger_mcp.client:main"

[tool.uv.workspace]
members = [
    "packages/mcp-server",
    "packages/dashboard-api", 
    "packages/database",
    "packages/shared"
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.14.1",
    "pytest-cov>=6.2.1",
    "pytest-redis>=3.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
    "bandit>=1.8.6",
    "coverage>=7.10.2",
    "httpx>=0.28.1",
    "fakeredis>=2.17.0",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
